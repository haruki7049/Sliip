[workspace]
resolver = "3"
members = [
  # xtask crate for lll
  "crates/xtask"
]

[workspace.package]
authors = ["haruki7049 <tontonkirikiri@gmail.com>"]
version = "0.2.1"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/haruki7049/lll"
publish = false

[workspace.metadata.crane]
name = "lll"

[workspace.dependencies]
anyhow = "1.0.104"
chumsky = "0.13.0"
clap = { version = "4.6.4", features = ["derive"] }
thiserror = "2.0.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[package]
name = "lll"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
chumsky.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
